version: 2
updates:
  # GitHub Actions 依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # NOTE: 当项目引入 package.json 后，再启用 npm 生态的依赖更新检查。
  # 当前站点为零依赖静态页面（Three.js 内置于 vendor/），配置 npm 会导致检查失败。
